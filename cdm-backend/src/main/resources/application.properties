server.port=8080

# H2 in-memory database (swap for PostgreSQL in prod)
spring.datasource.url=jdbc:h2:mem:cdmdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS allowed origin for React Native (update with your device IP in prod)
app.cors.allowed-origins=*

# Cash threshold: trigger alert when balance falls below this % of capacity
app.cash.low-threshold-percent=20

# Logging
logging.level.com.cdm=DEBUG
